# up.sh replaces GIT_REPO_URL_PLACEHOLDER with GIT_REPO_URL or git remote origin.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: GIT_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: infra/app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Manual sync during live demos so kubectl image set is not fought by selfHeal.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: GIT_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: infra/monitoring/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: GIT_REPO_URL_PLACEHOLDER
    targetRevision: HEAD
    path: infra/monitoring/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
