# Merge into argocd-cm after install (see up.sh). Failed AnalysisRuns otherwise
# keep Application health Degraded even after the Rollout has recovered.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_AnalysisRun: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Ignored: canary gate is reflected on the Rollout"
    return hs
