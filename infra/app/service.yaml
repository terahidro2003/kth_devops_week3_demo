# NodePort entrypoint — selects all demo pods (stable + canary). Replica weight ≈ traffic share (~50/50 during canary).
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
# Stable subset — selector refined by Argo Rollouts; Prometheus scrapes this for baseline.
apiVersion: v1
kind: Service
metadata:
  name: demo-stable
  labels:
    app: demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Canary subset — Rollouts retargets the selector; analysis filters by canary pod hash.
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
  labels:
    app: demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: http
