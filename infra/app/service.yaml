apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app: demo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: demo-stable
  labels:
    app: demo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
  labels:
    app: demo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: http
