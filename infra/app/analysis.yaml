# Fail canary when p99 latency on canary pods exceeds 1s.
# No traffic → vector(-1) → inconclusive (Rollouts requires count >= inconclusiveLimit).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-slo
spec:
  args:
    - name: latest-hash
  metrics:
    - name: hello-world-latency
      # failureLimit:1 fails fast under load; count==inconclusiveLimit ≈ 2 min talk window w/o traffic.
      initialDelay: 5s
      interval: 5s
      count: 24
      failureLimit: 1
      inconclusiveLimit: 24
      consecutiveErrorLimit: 10
      # -1 = no samples yet (inconclusive). Pass if 0 <= p99 <= 1s.
      successCondition: result[0] >= 0 && result[0] <= 1
      failureCondition: result[0] > 1
      provider:
        prometheus:
          address: http://prometheus.default.svc:9090
          query: |
            (
              histogram_quantile(
                0.99,
                sum by (le) (
                  rate(
                    http_server_requests_seconds_bucket{
                      uri="/hello-world",
                      pod=~"demo-{{args.latest-hash}}-.*"
                    }[30s]
                  )
                )
              )
            ) or vector(-1)
