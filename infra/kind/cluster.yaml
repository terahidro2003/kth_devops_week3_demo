kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      - containerPort: 30443
        hostPort: 8081
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
