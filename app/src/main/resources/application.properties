server.port=8080

# Expose Prometheus scrape endpoint and health
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name:demo}
management.metrics.tags.version=${demo.version}

# HTTP server request latency (histogram percentiles for request time)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

spring.application.name=demo

# Controlled fault injection for the demo; each app instance has its own counter.
demo.version=v2
demo.failure-every=2
